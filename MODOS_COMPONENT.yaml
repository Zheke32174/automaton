apiVersion: modos.pleiades/v1alpha1
kind: Component
metadata:
  name: automaton-agent-runtime-patterns
  repository: Zheke32174/automaton
  visibility: public
  lifecycle: experimental
  defaultBranch: main
  labels:
    modos.pleiades/subsystem: cognition-memory
    modos.pleiades/organ-class: agent-framework
spec:
  roles:
    - agent-runtime-patterns
    - automation-research
    - workflow-adapter-source
  authority: proposal
  inputs:
    - steward-scoped-objectives
    - bounded-tools
    - workflow-state
    - evaluation-evidence
  outputs:
    - automation-plans
    - workflow-candidates
    - runtime-patterns
  capabilitiesProvided:
    - workflow.plan@v1
    - agent.runtime.propose@v1
    - automation.pattern.export@v1
  capabilitiesRequired:
    - workspace.isolated@v1
    - tool.call.proposed@v1
    - evaluation.record@v1
    - governance.contract.validate@v1alpha1
  dataClasses:
    - public
    - internal
    - untrusted
  failurePolicy: quarantine
  promotionPolicy: evidence-gated
  relations:
    - type: governed-by
      targetRef: repo:Zheke32174/pleiades
      scope: governance
      required: true
    - type: supports
      targetRef: repo:Zheke32174/understory
      scope: build
      required: false
  notes: >-
    Automaton contributes patterns and candidate workflows; execution authority
    remains external and capability-gated. This update preserves the existing
    identity while aligning capability identifiers and typed relations with the
    promoted ecology schema.
