apiVersion: modos.pleiades/v1alpha1
kind: Component
metadata:
  name: automaton-agent-runtime-patterns
  repository: Zheke32174/automaton
  visibility: public
  lifecycle: reference
  defaultBranch: main
  labels:
    upstreamRepository: Conway-Research/automaton
    integrationMode: pattern-mining-only
spec:
  roles:
    - agent-runtime-pattern-reference
    - automation-research-corpus
    - workflow-adapter-candidate-source
  authority: none
  inputs:
    - reviewed-source-snapshots
    - upstream-release-metadata
    - security-review-evidence
  outputs:
    - extracted-runtime-patterns
    - threat-model-notes
    - adapter-candidates
  capabilitiesProvided:
    - automation.pattern.reference
    - agent.runtime.pattern.reference
  capabilitiesRequired:
    - artifact.read
    - workspace.isolated
    - evaluation.record
  dataClasses:
    - public
    - internal
    - untrusted
  failurePolicy: non-operational
  promotionPolicy: never-promote
  notes: This fork is executable upstream runtime source with shell, wallet, self-modification, replication, and external-service surfaces. MODOS may inspect it as untrusted reference material, but must not launch or promote this repository directly. Useful mechanisms require clean, bounded adapters that pass isolated evaluation and separate governed promotion.
